name: Release and Publish Pages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag for the release (leave empty to auto-generate)"
        required: false
        type: string
      release_name:
        description: "Release title (leave empty to use tag)"
        required: false
        type: string
      base_path:
        description: "Vite base path (leave empty for /<repo>/)"
        required: false
        type: string

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      pages_base_path: ${{ steps.meta.outputs.pages_base_path }}
    steps:
      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          INPUT_TAG="${{ github.event.inputs.release_tag }}"
          INPUT_NAME="${{ github.event.inputs.release_name }}"
          INPUT_BASE="${{ github.event.inputs.base_path }}"

          if [ -z "$INPUT_TAG" ]; then
            TAG="release-$(date -u +'%Y%m%d-%H%M%S')"
          else
            TAG="$INPUT_TAG"
          fi

          if [ -z "$INPUT_NAME" ]; then
            NAME="Release $TAG"
          else
            NAME="$INPUT_NAME"
          fi

          if [ -z "$INPUT_BASE" ]; then
            BASE="/${GITHUB_REPOSITORY#*/}/"
          else
            BASE="$INPUT_BASE"
          fi

          if [ "$BASE" != "/" ]; then
            case "$BASE" in
              /*) ;;
              *) BASE="/$BASE" ;;
            esac
            case "$BASE" in
              */) ;;
              *) BASE="$BASE/" ;;
            esac
          fi

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$NAME" >> "$GITHUB_OUTPUT"
          echo "pages_base_path=$BASE" >> "$GITHUB_OUTPUT"

  build-release:
    name: Build for release
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workaround optional deps bug)
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --include=optional --no-package-lock

      - name: Verify Linux native optional packages
        shell: bash
        run: |
          node -e "require.resolve('@rollup/rollup-linux-x64-gnu')"
          node -e "require.resolve('lightningcss-linux-x64-gnu')"

      - name: Build for release (base = /)
        run: npx vite build --config vite.config.figma.ts --base /

      - name: Create zip from dist
        shell: bash
        run: |
          ZIP_NAME="dist-${{ needs.metadata.outputs.release_tag }}.zip"
          cd dist
          zip -r "../$ZIP_NAME" .

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist-${{ needs.metadata.outputs.release_tag }}.zip
          if-no-files-found: error

  build-pages:
    name: Build for GitHub Pages
    runs-on: ubuntu-latest
    needs: metadata
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (workaround optional deps bug)
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --include=optional --no-package-lock

      - name: Verify Linux native optional packages
        shell: bash
        run: |
          node -e "require.resolve('@rollup/rollup-linux-x64-gnu')"
          node -e "require.resolve('lightningcss-linux-x64-gnu')"

      - name: Build for Pages (base = /<repo>/)
        run: npx vite build --config vite.config.figma.ts --base "${{ needs.metadata.outputs.pages_base_path }}"

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [metadata, build-release]
    permissions:
      contents: write
    steps:
      - name: Download release zip
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.release_tag }}
          name: ${{ needs.metadata.outputs.release_name }}
          files: release-artifacts/*.zip
          generate_release_notes: true
          prerelease: false
          draft: false

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [metadata, build-pages]
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
